name: Build

on:
  push:
    branches: [ "master", "java" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "master", "java" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        include:
          - os: macos-latest
            conda-environment-file: gdal/conda-environment-unix.yaml
          - os: ubuntu-latest
            conda-environment-file: gdal/conda-environment-unix.yaml
          - os: windows-latest
            conda-environment-file: gdal/conda-environment-windows.yaml

    steps:
      - name: "Enable long paths for Git"
        run: git config --global core.longpaths true

      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: "Obtain GDAL Git Submodule SHA"
        id: gdal-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:gdal/src)" >> $GITHUB_OUTPUT

      - name: "Setup MSVC"
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Install JDK"
        uses: actions/setup-java@v5
        with:
          cache: "maven"
          distribution: "temurin"
          java-version: "25"

      - name: "Install Conda"
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: gdal
          auto-update-conda: true
          environment-file: ${{ matrix.conda-environment-file }}
          # Caches the Conda env itself to speed up setup
          cache-environment: true
          cache-environment-key: ${{ runner.os }}-conda-${{ hashFiles(matrix.conda-environment-file) }}

      - name: "Cache GDAL Build"
        id: cache-gdal
        uses: actions/cache@v4
        with:
          path: gdal/install
          key: ${{ runner.os }}-gdal-${{ steps.gdal-sha.outputs.sha }}-${{ hashFiles('gdal/gdal-build.sh', matrix.conda-environment-file) }}

      - name: "Build GDAL with Java bindings"
        if: steps.cache-gdal.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/gdal
        shell: bash -l {0}
        run: |
          chmod +x ./gdal-build.sh
          ./gdal-build.sh

      - name: "Install dylibbundler"
        if: runner.os == 'macOS'
        run: brew install dylibbundler

      - name: "Copy GDAL libraries"
        working-directory: ${{ github.workspace }}/gdal
        shell: bash -l {0}
        run: |
          chmod +x ./copy-libraries.sh
          ./copy-libraries.sh

      - name: "Package"
        run: mvn -B clean package

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/target/*.zip

  release:
    name: "Create GitHub Release"
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: "Download artifacts"
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: "Create Release"
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/**/*.zip
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}